buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "2.15"
group = "me.proxycracked.universalaccountmanager"

sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

// Runtime account data and shop keys are never release inputs, including when merging libraries.
tasks.withType(Jar) {
    exclude 'config/**', 'run/**', 'logs/**', '**/*.dat', '**/*.log'
    exclude '**/universalaccountmanager_accounts.json', '**/localtsapi.txt', '**/nicealtsapi.txt'
    exclude '**/.env', '**/.env.*'
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
}

dependencies {
    compile files("libs/UniversalAccountManager-1.7-original.jar")
    compile files("libs/mixin-0.7.11-SNAPSHOT.jar")
    compile "net.java.dev.jna:platform:3.4.0"
}

jar {
    classifier = "overlay"
}

task repairedJar(type: Jar, dependsOn: reobfJar) {
    archiveName = "UniversalAccountManager-${version}.jar"
    destinationDir = file("$buildDir/libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(zipTree(jar.archivePath))
    from(zipTree("libs/UniversalAccountManager-1.7-original.jar"))
    from(zipTree("libs/mixin-0.7.11-SNAPSHOT.jar"))

    exclude "META-INF/MANIFEST.MF"
    exclude "META-INF/*.SF"
    exclude "META-INF/*.RSA"
    exclude "META-INF/*.DSA"

    manifest {
        attributes(
            "Manifest-Version": "1.0",
            "MixinConfigs": "mixins.uam.json",
            "FMLCorePluginContainsFMLMod": "true",
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "ForceLoadAsMod": "true"
        )
    }
}

assemble.dependsOn repairedJar

// Both editions contain identical code. The marker only chooses the initial appearance.
task modernJar(type: Jar, dependsOn: repairedJar) {
    archiveName = "UniversalAccountManager-${version}-modern.jar"
    destinationDir = file("$buildDir/libs")
    from { zipTree(repairedJar.archivePath) }
    from 'src/modern'
    manifest.from repairedJar.manifest
}

task legacyJar(type: Jar, dependsOn: repairedJar) {
    archiveName = "UniversalAccountManager-${version}-legacy.jar"
    destinationDir = file("$buildDir/libs")
    from { zipTree(repairedJar.archivePath) }
    from 'src/legacy'
    manifest.from repairedJar.manifest
}

task themeTest(type: JavaExec, dependsOn: compileJava) {
    classpath = files("$buildDir/classes/main", "$buildDir/theme-tests")
    main = 'ThemeSettingsTest'
    doFirst {
        ant.mkdir(dir: "$buildDir/theme-tests")
        ant.javac(srcdir: 'src/theme-test', destdir: "$buildDir/theme-tests", source: '1.8', target: '1.8',
            includeantruntime: false, classpath: sourceSets.main.output.classesDir)
    }
}

assemble.dependsOn modernJar, legacyJar

// Opt-in, isolated game smoke test. Never included in release jars.
sourceSets {
    smoke {
        java.srcDir 'src/smoke/java'
        compileClasspath = sourceSets.main.compileClasspath + files("$buildDir/classes/main")
    }
}
task smokeJar(type: Jar, dependsOn: [compileJava, compileSmokeJava]) {
    archiveName = 'uam-ui-smoke.jar'
    from sourceSets.smoke.output
}
reobf { smokeJar {} }
